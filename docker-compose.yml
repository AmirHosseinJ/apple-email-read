services:
  postgres:
    image: postgres:16-alpine
    container_name: email_read_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-email_read_db}
      POSTGRES_USER: ${POSTGRES_USER:-email_read_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email_read_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
